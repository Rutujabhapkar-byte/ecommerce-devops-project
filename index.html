<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ShopEasy</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <button id="cart-button">
                Cart (<span id="cart-count">0</span>)
            </button>
        </nav>
    </header>

    <section class="hero" id="home">
        <h2>Welcome to ShopEasy</h2>
        <p>Discover quality products at affordable prices.</p>
        <a href="#products" class="shop-button">Shop Now</a>
    </section>

    <main id="products">
        <h2>Our Products</h2>
        <div class="product-container" id="product-list"></div>
    </main>

    <section class="cart-section" id="cart">
        <h2>Your Shopping Cart</h2>
        <ul id="cart-items"></ul>
        <h3>Total: ₹<span id="cart-total">0.00</span></h3>
    </section>

    <footer>
        <p>© 2026 ShopEasy | DevOps CI/CD Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
