<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - E-Commerce Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="#home">ShopEasy</a>
        <input id="search" type="search" placeholder="Search products" aria-label="Search products">
        <nav>
            <a href="#products">Products</a>
            <button id="cart-button" type="button">
                Cart <span class="badge" id="cart-count">0</span>
            </button>
        </nav>
    </header>

    <section class="hero" id="home">
        <div class="hero-text">
            <h2>Everyday essentials, all in one place</h2>
            <p>Electronics, fashion, home, books, beauty and sports. Pick a shelf to start shopping.</p>
            <a href="#products" class="shop-button">Browse products</a>
        </div>
        <div class="hero-tiles" id="hero-tiles"></div>
    </section>

    <main id="products">
        <div class="section-head">
            <div>
                <h2>Our Products</h2>
                <p id="result-count" aria-live="polite"></p>
            </div>
            <label class="sort">Sort by
                <select id="sort">
                    <option value="featured">Featured</option>
                    <option value="low">Price: low to high</option>
                    <option value="high">Price: high to low</option>
                    <option value="name">Name: A to Z</option>
                </select>
            </label>
        </div>
        <div class="chips" id="chips"></div>
        <div class="product-container" id="product-list"></div>
    </main>

    <div class="overlay" id="overlay"></div>
    <aside class="cart-section" id="cart" aria-label="Shopping cart">
        <div class="cart-head">
            <h2>Your Shopping Cart</h2>
            <button type="button" id="cart-close" aria-label="Close cart">✕</button>
        </div>
        <ul id="cart-items"></ul>
        <div class="cart-foot">
            <p class="total">Total <strong>₹<span id="cart-total">0</span></strong></p>
            <button type="button" class="checkout" id="checkout">Checkout</button>
        </div>
    </aside>
    <div class="toast" id="toast" role="status"></div>

    <footer>
        <p>© 2026 ShopEasy | DevOps CI/CD Project</p>
    </footer>

    <script src="products.js"></script>
    <script src="script.js"></script>
</body>
</html>
